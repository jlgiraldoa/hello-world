<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AbueTV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@600;800&display=swap">
<style>
/* Layout: mobile-first. En el celular la app ocupa toda la pantalla; en computador se muestra dentro de un marco de teléfono.
   Columna fija = barra de estado / encabezado / contenido con scroll / dock (subir-bajar + 3 pestañas).
   Estilo: Tactile Neo-Brutalism accesible. Un solo tema claro deliberado (crema antirreflejo). Letra grande fija. */
:root{
  --cream:#F6F4EE; --card:#FFFFFF; --ink:#0F172A; --muted:#334155;
  --green:#10B981; --green-soft:#D1FAE5;
  --amber:#FBBF24; --amber-soft:#FEF3C7;
  --red:#DC2626; --red-soft:#FEE2E2;
  --sky-soft:#E0F2FE; --rose-soft:#FCE7F3; --lilac-soft:#EDE9FE; --peach-soft:#FFEDD5; --lime-soft:#ECFCCB;
  --sub:#FDE047;
  --stage:#E4DFD3; --bezel:#16130F;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-display:"Lexend", "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --shadow:0 6px 0 var(--ink);
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px dashed var(--ink);outline-offset:4px}

/* ---------- marco (solo computador) ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px}
.phone{position:relative;width:min(412px,100%);height:min(880px, calc(100vh - 80px));min-height:640px;background:var(--bezel);border-radius:52px;padding:12px;
  box-shadow:0 0 0 2px #3a342b, 0 30px 60px rgba(15,23,42,.35)}
.screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.stage-note{margin:0;font-size:16px;color:var(--muted);text-align:center;max-width:420px}
@media (max-width:520px){
  body{padding-left:0;padding-right:0;background:var(--cream)}
  .stage{padding-block:0;gap:0}
  .stage-note,.statusbar{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--cream)}
  .screen{border-radius:0}
}
.statusbar{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:16px;font-weight:700;position:relative}
.statusbar .cam{position:absolute;left:50%;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bezel)}
.batt{display:inline-block;width:26px;height:13px;border:2px solid var(--ink);border-radius:3px;position:relative;vertical-align:-1px}
.batt::after{content:"";position:absolute;inset:1px 5px 1px 1px;background:var(--ink)}

/* ---------- encabezado ---------- */
.apphead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 10px;border-bottom:3px solid var(--ink);background:var(--cream)}
.logo{display:flex;align-items:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:31px;letter-spacing:-.5px;line-height:1;flex:none}
.logo .tv{display:inline-flex;align-items:center;margin-left:4px;padding:4px 8px 5px;background:var(--green);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);position:relative}
.logo .tv::before,.logo .tv::after{content:"";position:absolute;top:-10px;width:3px;height:10px;background:var(--ink)}
.logo .tv::before{left:30%;transform:rotate(-25deg)}.logo .tv::after{right:30%;transform:rotate(25deg)}
.who{min-width:0;font-size:18px;font-weight:700;padding:6px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- contenido ---------- */
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 28px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--ink);border-radius:10px;border:2px solid var(--cream)}
.stack{display:flex;flex-direction:column;gap:20px}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
p.lead{margin:0;font-size:20px;color:var(--muted)}

/* ---------- botón físico ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:12px 16px;
  border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);
  font-weight:700;font-size:23px;line-height:1.15;text-align:center;transition:transform .08s ease, box-shadow .08s ease;
  -webkit-tap-highlight-color:transparent;user-select:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn .ico{font-size:1.25em;line-height:1;flex:none}
.btn[aria-disabled="true"]{opacity:.45}
.b-green{background:var(--green)} .b-amber{background:var(--amber)} .b-red{background:var(--red);color:#fff} .b-ink{background:var(--ink);color:#fff}
.b-big{min-height:84px;font-size:26px}
.b-proto{background:transparent;border-style:dashed;box-shadow:none;font-size:18px;min-height:56px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- bienvenida ---------- */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.hero-tv{align-self:center;position:relative;width:210px;height:150px;margin-top:22px;background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:var(--shadow);display:grid;place-items:center}
.hero-tv::before,.hero-tv::after{content:"";position:absolute;top:-30px;width:5px;height:34px;background:var(--ink);border-radius:3px}
.hero-tv::before{left:38%;transform:rotate(-28deg)}.hero-tv::after{right:38%;transform:rotate(28deg)}
.hero-tv .scr{width:170px;height:110px;border:4px solid var(--ink);border-radius:16px;background:var(--green);display:grid;place-items:center;font-size:52px}
.hero-tv .feet{position:absolute;bottom:-18px;width:120px;height:14px;border:4px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;background:var(--card)}
.welcome h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.welcome h1 .tv{background:var(--green);border:4px solid var(--ink);border-radius:12px;padding:0 10px;box-shadow:0 4px 0 var(--ink)}
.welcome .tagline{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.welcome .fine{margin:0;font-size:18px;color:var(--muted)}

/* ---------- pasos ---------- */
.steps{display:flex;flex-direction:column;gap:8px}
.steps b{font-size:20px}
.steps .bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps .bar i{display:block;height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--card)}
.steps .bar i.on{background:var(--green)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:22px}
.field input{width:100%;min-height:76px;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 16px;font-size:28px;font-weight:700;box-shadow:inset 0 4px 0 rgba(15,23,42,.08)}
.field input::placeholder{color:#64748B;font-weight:400}
.field small{font-size:18px;color:var(--muted)}

/* países */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{display:flex;align-items:center;gap:10px;min-height:70px;padding:8px 10px;border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;text-align:left;line-height:1.15}
.ctile .flag{font-size:32px;flex:none}
.ctile[aria-pressed="true"]{background:var(--ink);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* temas de interés (estilo "elige lo que te gusta") */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:138px;padding:12px 8px;
  border:3px solid var(--ink);border-radius:20px;background:var(--tint,#fff);box-shadow:var(--shadow);font-weight:700;font-size:21px;line-height:1.15;text-align:center;transition:transform .08s, box-shadow .08s}
.itile .em{font-size:46px;line-height:1}
.itile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.itile[aria-pressed="true"]{background:var(--ink);color:#fff;transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.itile .chk{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--card);display:grid;place-items:center;font-size:18px;color:var(--ink)}
.itile[aria-pressed="true"] .chk{background:var(--green)}
.picked{position:sticky;bottom:-28px;margin:0 -14px -28px;padding:12px 14px 16px;background:var(--cream);border-top:3px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.picked p{margin:0;font-size:20px;font-weight:700;text-align:center}

/* ---------- inicio ---------- */
.hello{display:flex;align-items:center;gap:12px;font-size:19px}
.hello .em{font-size:40px;line-height:1}
.hello b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15}
.voicebtn{justify-content:flex-start;text-align:left;gap:14px;padding:14px 16px;min-height:96px}
.voicebtn .mic{flex:none;width:62px;height:62px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-size:32px}
.voicebtn b{display:block;font-size:24px}
.voicebtn small{display:block;font-size:18px;font-weight:700}
.resume{background:var(--green-soft);border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.resume .lbl{font-weight:700;font-size:19px;margin:0}
.resume h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.2}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters .btn{min-height:64px;font-size:20px;padding:8px 10px}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.tipcard{background:var(--amber-soft);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tipcard p{margin:0;font-weight:700;font-size:20px}

/* tarjeta de video */
.vcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.f169{position:relative;aspect-ratio:16/9;max-width:100%;border-bottom:3px solid var(--ink);display:grid;place-items:center;
  background:
   linear-gradient(to top right, transparent calc(50% - 1.5px), rgba(15,23,42,.22) 50%, transparent calc(50% + 1.5px)),
   linear-gradient(to bottom right, transparent calc(50% - 1.5px), rgba(15,23,42,.22) 50%, transparent calc(50% + 1.5px)),
   var(--tint,#E2E8F0)}
.f169::before{content:"";position:absolute;inset:10px;border:3px dashed rgba(15,23,42,.45);border-radius:10px}
.f169 .ph{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.f169 .ph .em{font-size:34px;line-height:1.1}
.f169 .dur{position:absolute;right:14px;bottom:14px;background:var(--ink);color:#fff;font-weight:700;font-size:22px;padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.vbody{padding:16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:18px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--cream)}
.chip.ai{background:var(--amber-soft)}
.vbody h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.2;text-wrap:balance}
.vbody p{margin:0;font-size:19px;color:var(--muted)}
.meta{font-size:20px;font-weight:700;display:flex;flex-direction:column;gap:2px}

/* ---------- reproductor ---------- */
.player-title{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.screen169{position:relative;aspect-ratio:16/9;max-width:100%;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
  background:radial-gradient(circle at 30% 30%, var(--tint2,#065F46), #0F172A 75%);color:#fff}
.screen169 .ph{position:absolute;top:10px;left:10px;right:10px;text-align:center;font-weight:700;font-size:16px;border:2px dashed rgba(255,255,255,.55);border-radius:8px;padding:3px 6px}
.screen169 .em{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:48px}
.eq{position:absolute;left:12px;top:38%;display:flex;gap:4px;align-items:flex-end;height:46px}
.eq i{display:block;width:7px;height:20%;background:var(--green);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.45s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
.subs{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-weight:700;font-size:20px;line-height:1.25;color:var(--sub);
  background:rgba(0,0,0,.82);border-radius:8px;padding:5px 8px;min-height:2.7em;display:flex;align-items:center;justify-content:center}
.pausebadge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:800;font-size:22px;white-space:nowrap}
.timetext{display:flex;justify-content:space-between;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.timetext span:last-child{color:var(--muted)}
.track{height:26px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .9s linear}
.resume .track{height:18px}.resume .track i{transition:none}
.timebox{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:22px}
.volbars{display:flex;gap:8px;align-items:flex-end;justify-content:center;height:64px}
.volbars i{display:block;width:36px;border:3px solid var(--ink);border-radius:6px;background:var(--cream)}
.volbars i.on{background:var(--green)}
.volbars i:nth-child(1){height:20%}.volbars i:nth-child(2){height:40%}.volbars i:nth-child(3){height:60%}.volbars i:nth-child(4){height:80%}.volbars i:nth-child(5){height:100%}
.voltext{text-align:center;font-weight:700;font-size:20px;margin:0}
.btn.saved{background:var(--red-soft)}
.aiwhy{margin:0;font-size:18px;color:var(--muted);background:var(--amber-soft);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}

/* fin del video: el abuelo elige el siguiente */
.endpanel{background:var(--green-soft);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.endpanel h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.15}
.endpanel p{margin:0;font-size:20px;font-weight:700}
.mini{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;text-align:left;padding:10px;min-height:0}
.mini .th{aspect-ratio:16/9;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:32px;background:var(--tint,#E2E8F0);position:relative}
.mini .th::after{content:"▶";position:absolute;right:4px;bottom:2px;font-size:14px;background:var(--ink);color:#fff;border-radius:4px;padding:0 4px}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini small{display:block;font-size:18px;font-weight:700;color:var(--muted);margin-top:4px}

/* ---------- guardados / mis gustos ---------- */
.guest{background:var(--sky-soft);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.guest p{margin:0;font-size:20px;font-weight:700}
.guest small{font-size:18px;font-weight:400;color:var(--muted)}
.empty{background:var(--card);border:3px dashed var(--ink);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .em{font-size:52px}
.confirm{background:var(--red-soft);border:3px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:700;font-size:21px}
.profile{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.avatar{flex:none;width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--green);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px}
.profile b{display:block;font-size:25px;font-family:var(--f-display);line-height:1.15}
.profile span{font-size:19px;color:var(--muted)}

/* ---------- dock ---------- */
.dock{flex:none;border-top:3px solid var(--ink);background:var(--card);padding:10px 10px calc(8px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px}
.scrollrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrollrow .btn{min-height:56px;font-size:21px;padding:6px 8px;background:var(--cream);box-shadow:0 4px 0 var(--ink)}
.scrollrow .btn .ico{font-size:1.1em}
.scrollrow .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav .btn{flex-direction:column;gap:2px;min-height:84px;padding:6px 2px;font-size:clamp(16px,4.6vw,19px);letter-spacing:-.3px;position:relative;overflow:hidden}
.nav .btn .ico{font-size:30px}
.nav .btn[aria-current="page"]{background:var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.nav .btn[aria-current="page"]::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--mod)}

/* ---------- toast + modal de voz ---------- */
.toast{position:absolute;left:14px;right:14px;top:96px;z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:21px;font-weight:700;
  box-shadow:0 6px 0 rgba(15,23,42,.35);transition:opacity .25s, transform .25s;opacity:0;transform:translateY(-10px);pointer-events:none}
.toast.show{opacity:1;transform:none}
.modal{position:absolute;inset:0;z-index:40;background:var(--amber);display:flex;flex-direction:column;overflow-y:auto;padding:40px 16px 22px;gap:16px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;text-align:center;line-height:1.15}
.miczone{display:grid;place-items:center;padding:8px 0}
.micbig{position:relative;width:132px;height:132px;border-radius:50%;background:var(--card);border:4px solid var(--ink);display:grid;place-items:center;font-size:62px;box-shadow:var(--shadow)}
.micbig::before,.micbig::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--ink);animation:ring 2s ease-out infinite;opacity:0}
.micbig::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.listening{text-align:center;font-size:24px;font-weight:700;margin:0}
.dots i{display:inline-block;font-style:normal;animation:blink 1.4s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.modal .hint{margin:0;font-size:20px;font-weight:700;text-align:center}
.phrase{justify-content:flex-start;text-align:left;font-size:22px;min-height:72px}
.heard{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px;font-size:23px;font-weight:700;text-align:center}

@media (max-width:520px){ .statusbar{display:none} }
.welcome-mode .apphead{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<div class="stage">
  <div class="phone" id="phone">

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function forYou(){
  const country=S.account&&S.account.country;
  const score=v=>(S.interests.includes(v.topic)?10:0)+(country&&v.from.includes(country)?2:0);
  const list=S.interests.length?VIDEOS.filter(v=>S.interests.includes(v.topic)):VIDEOS.slice();
  return list.sort((a,b)=>score(b)-score(a));
}

/* ================= SONIDO DE PRUEBA DEL REPRODUCTOR ================= */
let AC=null, musicTimer=null, noteIdx=0;
function ac(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; } }
function tone(f,dur,type,vol){
  const c=ac(); if(!c) return;
  try{ const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}
const MOODS={
  musica:{notes:[392,440,494,523,587,523,494,440], step:430, type:"triangle"},
  fiesta:{notes:[523,659,784,659,523,587,698,587], step:260, type:"square"},
  cocina:{notes:[523,659,784,659,587,698,880,698], step:320, type:"sine"},
  oracion:{notes:[262,330,392,330,294,349,440,349], step:950, type:"sine"},
  calma:{notes:[330,392,440,392,349,440,523,440], step:700, type:"sine"}
};
const musicOn=()=>S.screen==="player"&&S.playing&&S.vol>0;
function musicUpdate(){
  if(musicOn()&&!musicTimer){
    const m=MOODS[TOP[VID[S.vid].topic].mood]; noteIdx=0;
    const vol=m.type==="square"?.012:.03;
    const play=()=>{ if(!musicOn()){ stopMusic(); return; } tone(m.notes[noteIdx++%m.notes.length], m.step/1000*1.6, m.type, vol*S.vol); };
    play(); musicTimer=setInterval(play,m.step);
  } else if(!musicOn()) stopMusic();
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; }

  });

  const has=S.interests.length>0;
  const keys=["para","todo"].concat(S.interests);
  if(TOP[S.filter]&&!keys.includes(S.filter)) keys.push(S.filter);
  const label=k=>k==="para"?"⭐ Para usted":k==="todo"?"📺 Todo":TOP[k].em+" "+TOP[k].label;
  const list=S.filter==="para"?forYou():S.filter==="todo"?VIDEOS:VIDEOS.filter(v=>v.topic===S.filter);
  const title=S.filter==="para"?(has?"⭐ Elegidos para usted":"📺 Videos para usted"):S.filter==="todo"?"📺 Todos los videos":label(S.filter);
  return `<div class="stack">
    ${greeting()}
    <button class="btn b-amber voicebtn" data-act="voice">
      <span class="mic" aria-hidden="true">🎤</span>
      <span><b>BUSCAR CON LA VOZ</b><small>Toque aquí y diga qué quiere ver</small></span>
    </button>
    ${resumeCard()}
    ${has?"":`<div class="tipcard"><p>⭐ Cuéntenos qué le gusta y le mostraremos primero esos videos.</p>
      <button class="btn" data-act="tab:likes"><span class="ico">⭐</span>ELEGIR MIS GUSTOS</button></div>`}
    <div class="filters" role="group" aria-label="Qué mostrar">
      ${keys.map(k=>`<button class="btn" data-act="filter:${k}" aria-pressed="${S.filter===k}">${label(k)}</button>`).join("")}
    </div>
    <h2 class="sec" id="listTitle">${title}</h2>
    ${list.map(videoCard).join("")}
    <p class="lead" style="text-align:center">Eso es todo por aquí. Toque <b>⬆️ SUBIR LISTA</b> para volver arriba.</p>
  </div>`;
}
function filterTo(id){ S.tab="home"; S.screen="home"; S.filter=id; render(); const h=$("listTitle"); if(h) h.scrollIntoView({block:"start"}); toast(TOP[id].em+" Aquí tiene: "+TOP[id].label); }

/* ================= REPRODUCTOR ================= */
function vPlayer(){
  const v=VID[S.vid], isSaved=S.saved.includes(v.id);
  return `<div class="stack">
    <button class="btn b-red b-big" data-act="exitPlayer"><span class="ico">⬅️</span>SALIR DEL VIDEO Y VOLVER</button>
    <h2 class="player-title">${v.em} ${esc(v.title)}</h2>
    <div class="screen169" id="pscreen" style="--tint2:${v.tint2}">
      <span class="ph">[ AQUÍ VA EL VIDEO EN PANTALLA ]</span>
      <span class="em" aria-hidden="true">${v.em}</span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="pausebadge" id="pbadge" hidden>⏸️ EN PAUSA</span>
      <div class="subs" id="psubs" aria-live="polite"></div>
    </div>
    <div class="timebox">
      <div class="timetext"><span id="tnow">0:00</span><span>de ${mmss(v.dur)}</span></div>
      <div class="track" role="progressbar" aria-label="Avance del video" aria-valuemin="0" aria-valuemax="${v.dur}" id="ptrack"><i id="pfill"></i></div>
    </div>
    <div id="endzone"></div>
    <button class="btn b-green b-big" data-act="toggle" id="ptoggle"></button>
    <button class="btn" data-act="rew"><span class="ico">⏪</span>REPETIR 10 SEGUNDOS</button>
    <div class="panel">
      <h3>🔊 Volumen</h3>
      <div class="volbars" id="volbars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="voltext" id="voltext"></p>
      <div class="row2">
        <button class="btn" data-act="volDown"><span class="ico">🔉</span>BAJAR</button>
        <button class="btn" data-act="volUp"><span class="ico">🔊</span>SUBIR</button>
      </div>
    </div>
    <button class="btn ${isSaved?"saved":""}" data-act="save" id="psave">${isSaved?'<span class="ico">✅</span>YA ESTÁ EN GUARDADOS':'<span class="ico">❤️</span>GUARDAR VIDEO'}</button>
    <button class="btn b-ink" data-act="next"><span class="ico">⏭️</span>OTRO VIDEO</button>
    <p class="aiwhy">🤖 Este video fue creado con inteligencia artificial por el equipo de AbueTV. 📍 ${v.from}</p>
    <button class="btn b-proto" data-act="skipEnd">🧪 Solo en el prototipo: saltar al final</button>
  </div>`;
}
function suggestions(v){
  const pool=VIDEOS.filter(x=>x.id!==v.id);
  const same=pool.filter(x=>x.topic===v.topic);
  const liked=pool.filter(x=>S.interests.includes(x.topic)&&x.topic!==v.topic);
  const rest=pool.filter(x=>!same.includes(x)&&!liked.includes(x));
  const out=[]; [same,liked,rest].forEach(g=>g.forEach(x=>{ if(out.length<3&&!out.includes(x)) out.push(x); }));
  return out;
}
function endPanel(v){
  return `<section class="endpanel" aria-live="polite">
    <h3>✅ Terminó el video</h3>
    <p>¿Qué quiere ver ahora? Toque uno:</p>
    ${suggestions(v).map(s=>`<button class="btn mini" data-act="play:${s.id}">
      <span class="th" style="--tint:${TOP[s.topic].tint}" aria-hidden="true">${s.em}</span>
      <span><b>${esc(s.title)}</b><small>⏱️ Dura ${mmss(s.dur)}</small><small>▶️ Toque para verlo</small></span></button>`).join("")}
    <button class="btn" data-act="toggle"><span class="ico">🔁</span>VER ESTE VIDEO DE NUEVO</button>
    <button class="btn" data-act="tab:home"><span class="ico">🏠</span>VOLVER AL INICIO</button>
  </section>`;
}
function updatePlayer(){
  const v=VID[S.vid]; if(!v||S.screen!=="player") return;
  const done=S.t>=v.dur;
  $("tnow").textContent=mmss(S.t);
  $("pfill").style.width=(S.t/v.dur*100)+"%";
  $("ptrack").setAttribute("aria-valuenow",S.t);
  $("pscreen").classList.toggle("paused",!S.playing);
  $("pbadge").hidden=S.playing||done;
  const idx=Math.min(v.subs.length-1,Math.floor(S.t/(v.dur/v.subs.length)));
  const line=done?"✅ El video terminó. Elija otro aquí abajo.":v.subs[idx];
  const subs=$("psubs"); if(subs.textContent!==line) subs.textContent=line;
  $("ptoggle").innerHTML=S.playing?'<span class="ico">⏸️</span>PAUSAR':(done?'<span class="ico">🔁</span>VER DE NUEVO':'<span class="ico">▶️</span>CONTINUAR');
  $("volbars").querySelectorAll("i").forEach((b,i)=>b.classList.toggle("on",i<S.vol));
  const vt=["Sin sonido","Muy bajito","Bajito","Normal","Fuerte","Muy fuerte"];
  $("voltext").textContent="Volumen: "+S.vol+" de 5 · "+vt[S.vol];
  const ez=$("endzone");
  if(done&&!S.endShown){ S.endShown=true; ez.innerHTML=endPanel(v); setTimeout(()=>ez.scrollIntoView({behavior:"smooth",block:"start"}),150); }
  if(!done&&S.endShown){ S.endShown=false; ez.innerHTML=""; }
  musicUpdate();
}
function saveLast(){
  const v=VID[S.vid]; if(!v) return;
  if(S.t>=5&&S.t<v.dur-3) S.last={id:v.id,t:S.t};
  else if(S.t>=v.dur-3&&S.last&&S.last.id===v.id) S.last=null;
  persist();
}
function openPlayer(id,from){
  if(S.screen==="player") saveLast();
  stopMusic(); closeVoice();
  S.tab="home"; S.screen="player"; S.vid=id; S.t=from||0; S.playing=true; S.endShown=false;
  render();
  clearInterval(tick);
  tick=setInterval(()=>{
    if(S.screen!=="player"){ clearInterval(tick); return; }
    if(S.playing){ S.t=Math.min(VID[S.vid].dur,S.t+1); if(S.t>=VID[S.vid].dur) S.playing=false; updatePlayer(); }
  },1000);
}
function stopPlayer(){ if(S.screen==="player") saveLast(); clearInterval(tick); S.playing=false; stopMusic(); }

/* ================= GUARDADOS ================= */
function guestBox(text){
  if(S.account) return "";
  return `<div class="guest"><p>👋 Está usando AbueTV sin cuenta.<br><small>${text}</small></p>
    <button class="btn" data-act="signupFromApp"><span class="ico">👤</span>CREAR MI CUENTA</button></div>`;
}
function vSaved(){
  const list=S.saved.map(id=>VID[id]).filter(Boolean);
  const head=`<h2 class="sec">❤️ Mis videos guardados</h2>${guestBox("Sus guardados se quedan en este teléfono. Con una cuenta no los pierde si cambia de celular.")}`;
  if(!list.length){
    return `<div class="stack">${head}
      <div class="empty"><span class="em" aria-hidden="true">💌</span>
        <p style="margin:0;font-size:22px;font-weight:700">Todavía no hay videos guardados.</p>
        <p class="lead">Cuando vea un video que le guste, toque <b>❤️ GUARDAR VIDEO</b> y aparecerá aquí.</p>
        <button class="btn b-green" data-act="tab:home"><span class="ico">📺</span>IR A VER VIDEOS</button></div></div>`;
  }
  return `<div class="stack">${head}
    <p class="lead">Tiene ${list.length} ${list.length===1?"video guardado":"videos guardados"}.</p>
    ${list.map(v=>{
      const extra=S.confirmUnsave===v.id
        ? `<div class="confirm"><p>¿Quiere quitar este video de Guardados?</p><div class="row2">
             <button class="btn b-red" data-act="unsaveYes:${v.id}">SÍ, QUITAR</button><button class="btn" data-act="unsaveNo">NO, DEJARLO</button></div></div>`
        : `<button class="btn" data-act="unsave:${v.id}"><span class="ico">💔</span>QUITAR DE GUARDADOS</button>`;
      return videoCard(v).replace(/<\/div>\s*<\/article>$/, extra+"</div></article>");
    }).join("")}
  </div>`;
}

/* ================= MIS GUSTOS ================= */
function vLikes(){
  const a=S.account;
  const flag=a&&a.country?(COUNTRIES.find(c=>c[1]===a.country)||["🌎"])[0]:"";
  return `<div class="stack">
    <h2 class="sec">⭐ Mis gustos</h2>
    <div class="profile">
      <span class="avatar" aria-hidden="true">${a?esc(a.name.trim().charAt(0).toUpperCase()):"👤"}</span>
      <div><b>${a?esc(a.name):"Invitado"}</b><span>${a?(a.country?flag+" "+esc(a.country):"🌎 Latinoamérica"):"Sin cuenta · guardado en este teléfono"}</span></div>
    </div>
    ${guestBox("Sus gustos se guardan en este teléfono. Cree una cuenta para llevarlos a cualquier celular.")}
    <h2 class="sec" style="font-size:24px">Temas que me gustan</h2>
    <p class="lead">Toque para elegir o quitar. Los videos de <b>⭐ Para usted</b> cambian según lo que elija.</p>
    ${interestGrid()}
    <p class="lead" id="likesCount" style="text-align:center;font-weight:700;color:var(--ink)">${S.interests.length?`Tiene ${S.interests.length} ${S.interests.length===1?"tema elegido":"temas elegidos"} ✔`:"No tiene temas elegidos: verá todos los videos."}</p>
    <button class="btn b-green b-big" data-act="tab:home"><span class="ico">📺</span>VER MIS VIDEOS</button>
    <button class="btn b-proto" data-act="reset">🧪 Solo en el prototipo: empezar de nuevo desde la bienvenida</button>
  </div>`;
}

/* ================= MODAL DE VOZ ================= */
function openVoice(){
  const m=$("modal");
  m.innerHTML=`<h2 id="modalTitle">🎤 Buscar con la voz</h2>
    <div class="miczone"><div class="micbig" aria-hidden="true">🎤</div></div>
    <p class="listening">Le estoy escuchando<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
    <p class="hint">Diga lo que quiere ver, o toque una de estas frases:</p>
    ${PHRASES.map((p,i)=>`<button class="btn phrase" data-act="phrase:${i}"><span class="ico">${p.ico}</span>«${p.text}»</button>`).join("")}
    <button class="btn b-red b-big" data-act="voiceClose"><span class="ico">⬅️</span>CERRAR Y VOLVER</button>`;
  m.hidden=false; m.scrollTop=0;
}
function closeVoice(){ clearTimeout(voiceTimer); const m=$("modal"); m.hidden=true; m.innerHTML=""; }
function choosePhrase(i){
  const p=PHRASES[i], m=$("modal");
  m.innerHTML=`<h2 id="modalTitle">🎤 Buscar con la voz</h2>
    <div class="miczone"><div class="micbig" aria-hidden="true">✅</div></div>
    <div class="heard" role="status">Entendí:<br>«${esc(p.text)}»</div>
    <p class="listening">Un momento, ya le muestro<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>`;
  voiceTimer=setTimeout(()=>{ closeVoice(); p.go(); },1300);
}

/* ================= NAVEGACIÓN ================= */
function goTab(t){
  stopPlayer(); closeVoice(); S.confirmUnsave=null;
  S.tab=t; S.screen=t;
  render();
}
function syncTiles(){
  document.querySelectorAll(".itile").forEach(b=>{
    const id=b.dataset.act.split(":")[1], on=S.interests.includes(id);
    b.setAttribute("aria-pressed",on); b.querySelector(".chk").textContent=on?"✔":"";
  });
  const n=S.interests.length;
  const pc=$("pickedCount"); if(pc){ pc.textContent=n?`Eligió ${n} ${n===1?"tema":"temas"} ✔`:"Todavía no eligió ningún tema";
    const f=document.querySelector('[data-act="finish"]'); if(f) f.innerHTML='<span class="ico">✅</span>'+(n?"LISTO, VER MIS VIDEOS":"VER TODOS LOS VIDEOS"); }
  const lc=$("likesCount"); if(lc) lc.textContent=n?`Tiene ${n} ${n===1?"tema elegido":"temas elegidos"} ✔`:"No tiene temas elegidos: verá todos los videos.";
}

$("phone").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.getAttribute("aria-disabled")==="true"){
    if(el.dataset.act==="nameNext"){ toast("✍️ Primero escriba su nombre, por favor."); $("nameInput")?.focus(); }
    return;
  }
  try{ navigator.vibrate&&navigator.vibrate(12); }catch(err){}
  const i=el.dataset.act.indexOf(":");
  const act=i<0?el.dataset.act:el.dataset.act.slice(0,i), arg=i<0?"":el.dataset.act.slice(i+1);
  switch(act){
    /* onboarding */
    case "startGuest": S.flow="guest"; S.screen="interests"; render(); break;
    case "startSignup": S.flow="signup"; S.draftName=""; S.draftCountry=null; S.screen="name"; render(); break;
    case "signupFromApp": stopPlayer(); S.backTo=S.tab; S.flow="signup"; S.draftName=""; S.draftCountry=null; S.onboarded=false; S.screen="name"; render(); break;
    case "nameNext": S.screen="country"; render(); break;
    case "country": S.draftCountry=arg; render(true); setTimeout(()=>{ S.screen="interests"; render(); },350); break;
    case "topic": {
      S.interests=S.interests.includes(arg)?S.interests.filter(x=>x!==arg):S.interests.concat(arg);
      if(S.onboarded) persist();
      syncTiles(); break;
    }
    case "finish": finishOnboarding(); break;
    case "back": {
      if(S.screen==="country") S.screen="name";
      else if(S.screen==="interests") S.screen=S.flow==="signup"?"country":"welcome";
      else if(S.screen==="name"){
        if(S.backTo){ S.onboarded=true; S.flow=null; S.tab=S.backTo; S.screen=S.backTo; S.backTo=null; }
        else S.screen="welcome";
      }
      render(); break;
    }
    /* app */
    case "tab": goTab(arg); break;
    case "filter": S.filter=arg; render(true); break;
    case "play": openPlayer(arg); break;
    case "resume": if(S.last) openPlayer(S.last.id,S.last.t); break;
    case "exitPlayer": goTab("home"); break;
    case "toggle": { const v=VID[S.vid]; if(S.t>=v.dur){ S.t=0; S.playing=true; content.scrollTop=0; } else S.playing=!S.playing; updatePlayer(); break; }
    case "rew": S.t=Math.max(0,S.t-10); updatePlayer(); toast("⏪ Volvimos 10 segundos atrás."); break;
    case "skipEnd": S.t=VID[S.vid].dur; S.playing=false; updatePlayer(); break;
    case "volDown": S.vol=Math.max(0,S.vol-1); updatePlayer(); break;
    case "volUp": S.vol=Math.min(5,S.vol+1); updatePlayer(); break;
    case "save": {
      if(!S.saved.includes(S.vid)){ S.saved.push(S.vid); persist(); toast("❤️ Listo. Este video quedó en GUARDADOS."); }
      else toast("✅ Este video ya estaba en GUARDADOS.");
      const b=$("psave"); b.classList.add("saved"); b.innerHTML='<span class="ico">✅</span>YA ESTÁ EN GUARDADOS'; break;
    }
    case "next": { const s=suggestions(VID[S.vid])[0]; openPlayer(s.id); toast("⏭️ Ahora vemos: "+s.title); break; }
    case "unsave": S.confirmUnsave=arg; render(true); break;
    case "unsaveNo": S.confirmUnsave=null; render(true); break;
    case "unsaveYes": S.saved=S.saved.filter(id=>id!==arg); S.confirmUnsave=null; persist(); render(true); toast("Listo, se quitó de GUARDADOS."); break;
    case "voice": openVoice(); break;
    case "voiceClose": closeVoice(); break;
    case "phrase": choosePhrase(+arg); break;
    case "reset": stopPlayer(); try{ localStorage.removeItem(STORE); }catch(err){}
      Object.assign(S,{onboarded:false,account:null,interests:[],saved:[],last:null,tab:"home",screen:"welcome",flow:null,backTo:null,filter:"para"}); render(); break;
    case "scrollUp": content.scrollBy({top:-content.clientHeight*0.65,behavior:"smooth"}); break;
    case "scrollDown": content.scrollBy({top:content.clientHeight*0.65,behavior:"smooth"}); break;
  }
});
content.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="nameInput"){ e.preventDefault(); $("nameNext").click(); } });

function updateScrollBtns(){
  const top=content.scrollTop<=2, bottom=content.scrollTop+content.clientHeight>=content.scrollHeight-2;
  $("upBtn").setAttribute("aria-disabled",top); $("downBtn").setAttribute("aria-disabled",bottom);
}
content.addEventListener("scroll",updateScrollBtns,{passive:true});
window.addEventListener("resize",updateScrollBtns);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("modal").hidden) closeVoice(); });
function clock(){ const d=new Date(); $("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
clock(); setInterval(clock,20000);

render();
})();
</script>
