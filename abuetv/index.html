<style>
/* Layout: mobile-first, lenguaje de app de video (miniaturas de borde a borde, lista "siguiente", barra inferior).
   Paleta fija "Sereno": verde azulado + arena + rojo solo para salir. Un solo tema claro deliberado. Letra grande fija. */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#1E293B; --muted:#4B5768; --line:#E2DED6; --chip:#ECEAE4;
  --primary:#0F766E; --primary-press:#0B5E58; --primary-soft:#E2EFED;
  --sand:#EADBB8; --sand-soft:#F6EFDF;
  --danger:#B42318; --danger-soft:#FBE9E7;
  --sub:#FDE68A; --stage:#DAD7CF; --bezel:#16130F;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-display:"Figtree", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(30,41,59,.06), 0 6px 18px rgba(30,41,59,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}

/* ---------- marco (solo computador) ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px}
.phone{position:relative;width:min(412px,100%);height:min(880px, calc(100vh - 80px));min-height:640px;background:var(--bezel);border-radius:50px;padding:11px;box-shadow:0 30px 60px rgba(15,23,42,.3)}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.stage-note{margin:0;font-size:16px;color:var(--muted);text-align:center;max-width:420px}
.statusbar{flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:700;background:var(--surface)}
@media (max-width:520px){
  body{padding-left:0;padding-right:0;background:var(--bg)}
  .stage{padding-block:0;gap:0}
  .stage-note,.statusbar{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
}

/* ---------- barra superior ---------- */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.6px;line-height:1}
.logo .mark{display:block;width:42px;height:42px;flex:none}
.logo .mark svg{display:block;width:100%;height:100%;border-radius:11px}
.logo em,.brandword em{font-style:normal;color:var(--primary)}
.welcome-mode .topbar{display:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.brand .mark svg{display:block;width:88px;height:88px;border-radius:22px;box-shadow:0 12px 26px rgba(15,118,110,.25)}
.brandword{margin:0;font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-1px;line-height:1}
.brand .tagline{font-size:22px;font-weight:700;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;min-height:48px;max-width:60%;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.me .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px}
.me .av .ic{width:22px;height:22px}
.me span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- contenido ---------- */
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.pad{padding:20px 16px 28px}
.col{display:flex;flex-direction:column;gap:18px}
h1.big{margin:0;font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.12;letter-spacing:-.5px;text-wrap:balance}
p.sub{margin:0;font-size:20px;color:var(--muted)}
.shelf{margin:0;padding:0 16px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.3px}

/* ---------- botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:10px 22px;border:0;border-radius:999px;font-weight:700;font-size:21px;line-height:1.15;text-align:center;transition:transform .1s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-press)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.xl{min-height:68px;font-size:22px}
.btn[aria-disabled="true"]{opacity:.45}
.proto{width:100%;min-height:52px;border:2px dashed var(--line);border-radius:14px;background:transparent;color:var(--muted);font-size:18px;font-weight:700}

/* ---------- miniaturas ---------- */
.thumb{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;background:var(--g);overflow:hidden;color:#fff}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.2),transparent 62%),linear-gradient(to top,rgba(0,0,0,.42),transparent 50%)}
.thumb .art{position:relative;z-index:1;font-size:78px;line-height:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.thumb .ph{position:absolute;z-index:2;top:10px;left:10px;font-size:15px;font-weight:700;background:rgba(0,0,0,.42);border:1.5px dashed rgba(255,255,255,.65);border-radius:6px;padding:1px 8px}
.thumb .dur{position:absolute;z-index:2;right:10px;bottom:10px;background:rgba(0,0,0,.82);font-weight:700;font-size:18px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.thumb .go{position:absolute;z-index:2;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font-weight:700;font-size:18px;padding:5px 14px 5px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.thumb .go .ic{width:16px;height:16px;fill:var(--ink);stroke-width:0}
.thumb.sm .art{font-size:40px}
.thumb.sm .dur{font-size:18px;right:6px;bottom:6px;padding:1px 6px}
.thumb .bar{position:absolute;z-index:2;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.45)}
.thumb .bar i{display:block;height:100%;background:var(--primary)}

/* ---------- bienvenida ---------- */
.collage{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.collage .thumb{aspect-ratio:1;border-radius:14px;box-shadow:var(--shadow)}
.collage .thumb .art{font-size:34px}
.fine{margin:0;font-size:18px;color:var(--muted);text-align:center}

/* ---------- pasos ---------- */
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:flex;align-items:center;gap:4px;min-height:52px;padding:0 20px 0 12px;border:0;border-radius:999px;background:var(--danger);color:#fff;font-weight:700;font-size:20px}
.stepbar span{font-weight:700;font-size:19px;color:var(--muted)}
.progress{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:999px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:20px}
.input{width:100%;min-height:74px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:0 18px;font-size:26px;font-weight:700}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input::placeholder{color:#7A8494;font-weight:400}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.country{display:flex;align-items:center;gap:10px;min-height:66px;padding:0 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:19px;line-height:1.15;text-align:left}
.country .flag{font-size:28px;flex:none}
.country[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

/* temas (estilo "elija lo que le gusta") */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{position:relative;aspect-ratio:1/1.08;border:0;border-radius:20px;overflow:hidden;padding:0;background:var(--g);color:#fff;text-align:left;transition:transform .12s, box-shadow .15s}
.tile:active{transform:scale(.97)}
.tile .art{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:60px;line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.62));font-weight:700;font-size:20px;line-height:1.15}
.tile .ck{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:rgba(0,0,0,.18);display:grid;place-items:center}
.tile .ck .ic{width:22px;height:22px;stroke-width:3;opacity:0}
.tile[aria-pressed="true"]{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--primary)}
.tile[aria-pressed="true"] .ck{background:var(--primary)}
.tile[aria-pressed="true"] .ck .ic{opacity:1}
.picked{position:sticky;bottom:0;margin:6px -16px -28px;padding:12px 16px 18px;background:rgba(247,246,242,.96);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
.picked p{margin:0;font-size:19px;font-weight:700;text-align:center}

/* ---------- inicio ---------- */
.home{display:flex;flex-direction:column;gap:14px;padding:14px 0 28px}
.greet{padding:0 16px}
.greet b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.4px;line-height:1.15}
.greet span{font-size:19px;color:var(--muted)}
.voice{margin:0 16px;display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 18px 10px 10px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line), var(--shadow);text-align:left}
.voice .mic{flex:none;width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.voice .mic .ic{width:28px;height:28px}
.voice b{display:block;font-size:22px}
.voice small{display:block;font-size:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px}
.chip{min-height:52px;padding:0 18px;border:0;border-radius:12px;background:var(--chip);font-weight:700;font-size:19px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.resume{margin:0 16px;display:grid;grid-template-columns:138px 1fr;gap:14px;align-items:center;padding:10px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.resume .thumb{border-radius:12px}
.resume small{display:block;font-weight:700;font-size:18px;color:var(--primary)}
.resume b{display:block;font-size:20px;line-height:1.2;margin:2px 0}
.resume .when{display:block;font-size:18px;color:var(--muted)}
.tip{margin:0 16px;padding:16px;border-radius:20px;background:var(--sand-soft);display:flex;flex-direction:column;gap:12px}
.tip p{margin:0;font-size:20px;font-weight:700}
.feed{display:flex;flex-direction:column;gap:10px}
.vc{background:var(--surface)}
.vc-hit{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.vc-meta{display:flex;gap:12px;padding:12px 16px 18px}
.chan{flex:none;width:46px;height:46px}
.chan svg{display:block;width:46px;height:46px;border-radius:50%}
.vc-title{display:block;font-size:21px;font-weight:700;line-height:1.25}
.vc-line{display:block;font-size:18px;color:var(--muted);margin-top:4px}
.vc-line .ic{width:16px;height:16px;vertical-align:-2px}
.endnote{margin:0;padding:0 16px;font-size:19px;color:var(--muted);text-align:center}

/* ---------- reproductor ---------- */
.exitbar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border:0;background:var(--danger);color:#fff;font-weight:700;font-size:21px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--g);overflow:hidden;color:#fff}
.video::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.15),rgba(0,0,0,.45) 80%)}
.video .art{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.video .ph{position:absolute;top:10px;left:10px;font-size:15px;font-weight:700;background:rgba(0,0,0,.42);border:1.5px dashed rgba(255,255,255,.65);border-radius:6px;padding:1px 8px}
.eq{position:absolute;right:12px;top:10px;display:flex;gap:3px;align-items:flex-end;height:24px}
.eq i{display:block;width:5px;height:20%;background:#fff;border-radius:2px;animation:eq 1s ease-in-out infinite;opacity:.9}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.subs{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-weight:700;font-size:20px;line-height:1.25;color:var(--sub);background:rgba(0,0,0,.78);border-radius:8px;padding:6px 10px}
.pausebadge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;font-size:20px;white-space:nowrap}
.pbody{display:flex;flex-direction:column;gap:16px;padding:14px 16px 28px}
.time{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.time span:last-child{color:var(--muted)}
.track{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .9s linear}
.ptitle{margin:0;font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.2;letter-spacing:-.3px;text-wrap:balance}
.pmeta{margin:-8px 0 0;font-size:18px;color:var(--muted)}
.pmeta .ic{width:16px;height:16px;vertical-align:-2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:94px;padding:8px 4px;border:0;border-radius:18px;background:var(--chip);font-weight:700;font-size:18px;line-height:1.15;text-align:center}
.actions button .ic{width:30px;height:30px}
.actions button:active{transform:scale(.97)}
.actions button.on{background:var(--primary-soft);color:var(--primary)}
.vol{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.vol p{margin:0;font-weight:700;font-size:19px;text-align:center}
.volrow{display:grid;grid-template-columns:84px 1fr 84px;gap:10px;align-items:center}
.volrow button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;border:0;border-radius:16px;background:var(--chip);font-weight:700;font-size:18px}
.volrow button .ic{width:26px;height:26px}
.bars{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:50px}
.bars i{display:block;flex:1;max-width:28px;border-radius:6px;background:var(--chip)}
.bars i.on{background:var(--primary)}
.bars i:nth-child(1){height:24%}.bars i:nth-child(2){height:42%}.bars i:nth-child(3){height:60%}.bars i:nth-child(4){height:80%}.bars i:nth-child(5){height:100%}
.ended{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--primary-soft)}
.ended .ic{width:30px;height:30px;color:var(--primary);stroke-width:2.8}
.ended b{display:block;font-family:var(--f-display);font-size:23px;line-height:1.15}
.ended span{font-size:19px}
.h3{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:23px}
.rows{display:flex;flex-direction:column;gap:4px;margin:0 -16px}
.row{display:grid;grid-template-columns:148px 1fr;gap:14px;align-items:start;width:100%;padding:8px 16px;border:0;background:none;text-align:left}
.row:active{background:var(--chip)}
.row .thumb{border-radius:12px}
.row b{display:block;font-size:19px;line-height:1.22}
.row small{display:block;font-size:18px;color:var(--muted);margin-top:2px}
.row .see{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:18px}
.row .see .ic{width:14px;height:14px;fill:var(--primary);stroke-width:0}
.aiwhy{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:18px;color:var(--muted);background:var(--sand-soft);border-radius:14px;padding:10px 12px}
.aiwhy .ic{width:20px;height:20px;margin-top:2px}

/* ---------- guardados / mis gustos ---------- */
.notice{padding:16px;border-radius:20px;background:var(--sand-soft);display:flex;flex-direction:column;gap:12px}
.notice p{margin:0;font-size:20px;font-weight:700}
.notice small{display:block;font-size:18px;font-weight:400;color:var(--muted);margin-top:4px}
.saveditem{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line);margin:0 -16px}
.saveditem .rm{align-self:flex-end;margin-right:16px;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--danger);font-weight:700;font-size:18px}
.confirm{margin:0 16px;padding:14px;border-radius:16px;background:var(--danger-soft);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:700;font-size:20px}

/* ================= SONIDO DE PRUEBA DEL REPRODUCTOR ================= */
let AC=null, musicTimer=null, noteIdx=0;
function ac(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; } }
function tone(f,dur,type,vol){
  const c=ac(); if(!c) return;
  try{ const t=c.currentTime,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}

  musica:{notes:[392,440,494,523,587,523,494,440],step:430,type:"triangle"},

  cocina:{notes:[523,659,784,659,587,698,880,698],step:320,type:"sine"},
  oracion:{notes:[262,330,392,330,294,349,440,349],step:950,type:"sine"},

};
const curItem=()=>S.screen==="player"?VID[S.vid]:S.screen==="shorts"?SHO[S.sOrder[S.sIdx]]:null;
const musicOn=()=>((S.screen==="player"&&S.playing)||(S.screen==="shorts"&&S.sPlaying))&&S.vol>0;
function musicUpdate(){
  if(musicOn()&&!musicTimer){
    const m=MOODS[TOP[curItem().topic].mood]; noteIdx=0;
    const play=()=>{ if(!musicOn()){ stopMusic(); return; } tone(m.notes[noteIdx++%m.notes.length],m.step/1000*1.6,m.type,.03*S.vol); };
    play(); musicTimer=setInterval(play,m.step);
  } else if(!musicOn()) stopMusic();
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; }

  win:()=>seq([[523,.3,0],[659,.3,.14],[784,.3,.28],[1047,.45,.42]])
};
const canSpeak=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
function clean(t){ return String(t).replace(/\p{Extended_Pictographic}|️/gu,"").replace(/[…«»]/g," ").replace(/\s+/g," ").trim(); }
function say(t){
  if(!canSpeak) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean(t)); u.lang="es-419"; u.rate=.85;
    const vs=speechSynthesis.getVoices(); const v=vs.find(v=>/^es[-_](419|MX|CO|US|AR)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u); }catch(e){}
}
function hush(){ if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){} }

/* --- Encontrar parejas --- */
function newMemory(){
  const n=LEVELS[S.memLevel].pairs, figs=shuffle(FIGURES).slice(0,n);
  S.mem={pairs:n,first:null,lock:false,found:0,msg:{cls:"",icon:"bulb",text:"Toque una carta para darle la vuelta."},
    cards:shuffle(figs.concat(figs)).map((f,i)=>({i,k:f.k,em:f.em,name:f.name,up:false,done:false,peek:false}))};
}
function vMemory(){
  const m=S.mem;
  return gameShell(GAME.memory,`
    <div class="seg" role="group" aria-label="Dificultad">${Object.entries(LEVELS).map(([k,l])=>`<button data-act="level:${k}" aria-pressed="${S.memLevel===k}">${l.label}<small>${l.note}</small></button>`).join("")}</div>
    <div class="stat"><span>Parejas encontradas</span><b id="memCount">${m.found} de ${m.pairs}</b></div>
    ${msgBox(m.msg,"gmsg")}
    <div class="mgrid ${m.pairs===4?"easy":""}" id="mgrid">
      ${m.cards.map(c=>`<button class="mcard" data-act="card:${c.i}" aria-label="Carta ${c.i+1}, boca abajo"><span class="inner">
        <span class="face back"><span class="qm" aria-hidden="true">?</span><small>Toque</small></span>
        <span class="face front"><span class="em" aria-hidden="true">${c.em}</span><small>${c.name}</small></span></span></button>`).join("")}
    </div>
    <div id="memWin"></div>
    <button class="btn ghost" data-act="hint" id="hintBtn">${ic("bulb")}Dame una pista</button>
    <button class="btn ghost" data-act="memAgain">${ic("again")}Empezar de nuevo</button>`);
}
function memMsg(cls,icon,text){ S.mem.msg={cls,icon,text}; const el=$("gmsg"); if(el) el.outerHTML=msgBox(S.mem.msg,"gmsg"); }
function syncMem(){
  const m=S.mem;
  document.querySelectorAll("#mgrid .mcard").forEach((b,i)=>{ const c=m.cards[i], show=c.up||c.peek;
    b.classList.toggle("up",show); b.classList.toggle("done",c.done);
    b.setAttribute("aria-label",c.done?`Carta ${i+1}: ${c.name}, pareja encontrada`:(show?`Carta ${i+1}: ${c.name}`:`Carta ${i+1}, boca abajo`)); });
  $("memCount").textContent=m.found+" de "+m.pairs;
}
function flipCard(i){
  const m=S.mem, c=m.cards[i];
  if(m.lock||c.up||c.done) return;
  c.up=true; SFX.flip();
  if(m.first===null){ m.first=i; syncMem(); memMsg("","bulb",`Salió: ${c.name}. Ahora busque su pareja.`); return; }
  const a=m.cards[m.first]; m.first=null;
  if(a.k===c.k){
    a.done=c.done=true; m.found++; syncMem();
    if(m.found===m.pairs){
      SFX.win(); memMsg("good","check","¡Excelente memoria! Encontró todas las parejas."); $("hintBtn").hidden=true;
      $("memWin").innerHTML=`<div class="win"><span class="wico">${ic("star","fill")}</span><b>¡Muy bien hecho!</b><p>Encontró las ${m.pairs} parejas. ¡Qué buena memoria!</p>
        <button class="btn primary xl" data-act="memAgain">${ic("again")}Jugar otra vez</button>
        ${m.pairs===4?`<button class="btn ghost" data-act="level:normal">Probar el nivel Normal</button>`:""}</div>`;
      setTimeout(()=>{ const w=$("memWin"); if(w) w.scrollIntoView({behavior:"smooth",block:"center"}); },400);
    } else { setTimeout(SFX.ok,120); memMsg("good","check",`${pick(PRAISE)} Encontró la pareja: ${c.name}.`); }
  } else {
    m.lock=true; syncMem(); setTimeout(SFX.soft,150);
    memMsg("soft","again",`${a.name} y ${c.name} no son iguales. Mírelas bien: se voltean solitas.`);
    memTimer=setTimeout(()=>{ a.up=c.up=false; m.lock=false; if(S.screen!=="memory") return; syncMem(); memMsg("","bulb","Con calma. Toque otra carta."); },2200);
  }
}
function hint(){
  const m=S.mem; if(m.lock||m.found===m.pairs) return;
  let targets, txt;
  if(m.first!==null){ const k=m.cards[m.first].k; targets=m.cards.filter(c=>c.k===k&&!c.up); txt="Mire: su pareja está ahí. Cuando se voltee, tóquela."; }
  else { const pend=m.cards.filter(c=>!c.done&&!c.up), c=pick(pend); targets=pend.filter(x=>x.k===c.k); txt="Mire bien estas dos cartas: son iguales. Cuando se volteen, búsquelas."; }
  targets.forEach(c=>c.peek=true); m.lock=true; syncMem(); memMsg("","bulb",txt); SFX.bell();
  const el=document.querySelectorAll("#mgrid .mcard")[targets[0].i]; if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  memTimer=setTimeout(()=>{ targets.forEach(c=>c.peek=false); m.lock=false; if(S.screen!=="memory") return; syncMem(); memMsg("","bulb","¡Ahora usted! Toque las cartas, sin prisa."); },1900);
}

/* --- Refrán y Preguntas de nuestra tierra (mismo motor) --- */
function newQuiz(kind){ S.quiz={kind,items:shuffle(kind==="refran"?REFRANES:TRIVIA).slice(0,8),n:0,first:0,tried:[],solved:false,opts:null,finished:false}; setOpts(); }
function setOpts(){ const z=S.quiz, it=z.items[z.n]; z.opts=shuffle([{t:it.ok,ok:true},{t:it.no,ok:false}]); z.tried=[]; z.solved=false; }
const fullAns=(z,it)=>z.kind==="refran"?it.q.replace("…","")+" "+it.ok.replace("…",""):it.ok;
function vQuiz(){
  const z=S.quiz, g=GAME[z.kind], ref=z.kind==="refran";
  if(z.finished) return gameShell(g,`<div class="win"><span class="wico">${ic("star","fill")}</span><b>¡Excelente!</b>
    <p>Terminó ${ref?"los":"las"} ${z.items.length} ${ref?"refranes":"preguntas"}. Acertó ${z.first} a la primera.</p>
    <p>${ref?"¡Usted sabe mucho de los dichos de antes!":"¡Qué bien conoce nuestra tierra!"}</p>
    <button class="btn primary xl" data-act="quizAgain">${ic("again")}Jugar otra vez</button>
    <button class="btn ghost" data-act="exitGame">Elegir otro juego</button></div>`);
  const it=z.items[z.n];
  let m={cls:"",icon:"bulb",text:ref?"¿Cómo termina este refrán? Toque una opción.":"Toque la respuesta que crea correcta."};
  if(z.solved) m={cls:"good",icon:"check",text:z.tried.length===1?pick(PRAISE):"¡Eso es! Muy bien."};
  else if(z.tried.length) m={cls:"soft",icon:"again",text:"¡Casi! Esa no es. Pruebe con la otra opción."};
  return gameShell(g,`
    <div class="stat"><span>${ref?"Refrán":"Pregunta"}</span><b>${z.n+1} de ${z.items.length}</b></div>
    <div class="qcard"><p class="lbl">${ref?"Complete el refrán:":"Pregunta:"}</p><p class="q">${esc(it.q)}</p>
      ${z.solved&&ref?`<p class="full">${esc(fullAns(z,it))}</p>`:""}
      ${canSpeak?`<button class="btn ghost" data-act="listen">${ic("vol2")}Escuchar en voz alta</button>`:""}</div>
    ${msgBox(m)}
    ${z.opts.map((o,i)=>{ const tried=z.tried.includes(i), cls=(z.solved&&o.ok)?"right":(tried&&!o.ok?"wrong":"");
      const tag=cls==="right"?ic("check"):cls==="wrong"?ic("x"):(i===0?"A":"B");
      return `<button class="opt ${cls}" data-act="opt:${i}" ${(z.solved||tried)?'aria-disabled="true"':""}><span class="tag">${tag}</span><span>${esc(o.t)}</span></button>`; }).join("")}
    ${z.solved?`<button class="btn primary xl" data-act="quizNext">${z.n+1<z.items.length?"Siguiente":"Ver mi resultado"}${ic("right")}</button>`:""}
    <button class="btn ghost" data-act="quizAgain">${ic("again")}Empezar de nuevo</button>`);
}
function quizOpt(i){
  const z=S.quiz; if(z.solved||z.tried.includes(i)) return;
  z.tried.push(i);
  if(z.opts[i].ok){ z.solved=true; if(z.tried.length===1) z.first++; SFX.ok(); const it=z.items[z.n]; setTimeout(()=>say((z.kind==="refran"?"":"¡Así es! ")+fullAns(z,it)),650); }
  else SFX.soft();
  render(true);
}

function newBingo(){
  S.bingo={nums:shuffle(Array.from({length:30},(_,i)=>i+1)).slice(0,9).sort((a,b)=>a-b),marked:Array(9).fill(false),
    pile:shuffle(Array.from({length:30},(_,i)=>i+1)),called:[],cur:null,won:false,msg:{cls:"",icon:"bell",text:"Toque «Cantar número» para sacar la primera balota."}};
}
function vBingo(){
  const b=S.bingo;
  return gameShell(GAME.bingo,`
    <div class="ballbox"><span>${b.cur?"Salió el número":"Balota"}</span><span class="ball ${b.cur?"":"empty"}" aria-live="polite">${b.cur??"Aún no<br>sale"}</span></div>
    ${b.won?"":`<button class="btn primary xl" data-act="bingoCall">${ic("bell")}Cantar número</button>`}
    ${msgBox(b.msg)}
    <div class="bgrid" role="group" aria-label="Su cartón"><div class="bhead">Mi cartón</div>
      ${b.nums.map((n,i)=>`<button class="cell ${b.marked[i]?"mark":(n===b.cur?"call":"")}" data-act="cell:${i}" aria-label="Número ${n}${b.marked[i]?", marcado":""}">${n}${b.marked[i]?"<small>Marcado</small>":""}</button>`).join("")}
    </div>
    ${b.won?`<div class="win"><span class="wico">${ic("star","fill")}</span><b>¡Lotería!</b><p>¡Felicitaciones! Completó una línea.</p>
      <button class="btn primary xl" data-act="bingoAgain">${ic("again")}Jugar otra vez</button></div>`:""}
    <p class="history">Números que ya salieron: <b>${b.called.length?b.called.join(" · "):"ninguno todavía"}</b></p>
    <button class="btn ghost" data-act="bingoAgain">${ic("again")}Cartón nuevo</button>`);
}
function bingoCall(){
  const b=S.bingo; if(b.won||!b.pile.length) return;
  b.cur=b.pile.pop(); b.called.push(b.cur);
  const has=b.nums.includes(b.cur);
  b.msg=has?{cls:"good",icon:"check",text:`¡Usted tiene el ${b.cur}! Tóquelo en su cartón para marcarlo.`}
           :{cls:"",icon:"bell",text:`El ${b.cur} no está en su cartón. Toque «Cantar número» otra vez.`};
  SFX.bell(); setTimeout(()=>say(`Salió el número ${b.cur}. `+(has?"¡Usted lo tiene!":"")),350);
  render(true);
}
function bingoCell(i){
  const b=S.bingo; if(b.won||b.marked[i]) return;
  const n=b.nums[i];
  if(!b.called.includes(n)){ SFX.soft(); b.msg={cls:"soft",icon:"again",text:`El ${n} todavía no ha salido. Espere con calma.`}; render(true); return; }
  b.marked[i]=true;
  if(LINES.some(l=>l.every(k=>b.marked[k]))){ b.won=true; SFX.win(); say("¡Lotería! ¡Felicitaciones!"); b.msg={cls:"good",icon:"star",text:"¡Lotería! ¡Excelente, completó una línea!"}; }
  else { SFX.ok(); b.msg={cls:"good",icon:"check",text:`${pick(PRAISE)} Marcó el ${n}.`}; }
  render(true);
}

function goTab(t){ stopPlayer(); stopShorts(); closeModal(); clearTimeout(memTimer); hush(); S.confirmUnsave=null; if(t==="shorts"){ openShorts(); return; } S.tab=t; S.screen=t; render(); }
function syncTiles(){

let downPt=null;
$("phone").addEventListener("pointerdown",e=>{ downPt={x:e.clientX,y:e.clientY}; },true);
$("phone").addEventListener("click",e=>{
  if(e.detail>0&&downPt&&Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y)>14) return;
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.getAttribute("aria-disabled")==="true"){
    if(el.dataset.act==="nameNext"){ toast("Primero escriba su nombre, por favor."); $("nameInput").focus(); }
    if(el.dataset.act==="countryNext") toast("Primero toque su país, por favor.");
    return;
  }
  try{ navigator.vibrate&&navigator.vibrate(10); }catch(err){}
  const k=el.dataset.act.indexOf(":");
  const act=k<0?el.dataset.act:el.dataset.act.slice(0,k), arg=k<0?"":el.dataset.act.slice(k+1);
  switch(act){
    case "startGuest": S.flow="guest"; S.screen="interests"; render(); break;
    case "startSignup": S.flow="signup"; S.draftName=""; S.draftCountry=null; S.screen="name"; render(); break;
    case "signupFromApp": stopPlayer(); S.backTo=S.tab; S.flow="signup"; S.draftName=""; S.draftCountry=null; S.onboarded=false; S.screen="name"; render(); break;
    case "nameNext": S.screen="country"; render(); break;
    case "country": S.draftCountry=arg; render(true); break;
    case "topic": S.interests=S.interests.includes(arg)?S.interests.filter(x=>x!==arg):S.interests.concat(arg); if(S.onboarded) persist(); syncTiles(); break;
    case "finish": finishOnboarding(); break;
    case "back":
      if(S.screen==="country") S.screen="name";
      else if(S.screen==="interests") S.screen=S.flow==="signup"?"country":"welcome";
      else if(S.screen==="name"){ if(S.backTo){ S.onboarded=true; S.flow=null; S.tab=S.backTo; S.screen=S.backTo; S.backTo=null; } else S.screen="welcome"; }
      render(); break;
    case "tab": goTab(arg); break;
    case "filter": S.filter=arg; S.showTopics=false; render(true); break;
    case "topics": S.showTopics=!S.showTopics; render(true); break;
    case "toastClose": clearTimeout(toastTimer); $("toast").classList.remove("show"); break;
    case "countryNext": S.screen="interests"; render(); break;
    case "exitShorts": goTab(S.ret&&S.ret!=="shorts"?S.ret:"home"); break;
    case "play": openPlayer(arg); break;
    case "resume": if(S.last) openPlayer(S.last.id,S.last.t); break;
    case "exitPlayer": goTab(S.ret||"home"); break;
    case "toggle": { const v=VID[S.vid]; if(S.t>=v.dur){ S.t=0; S.playing=true; content.scrollTop=0; } else S.playing=!S.playing; updatePlayer(); break; }
    case "rew": S.t=Math.max(0,S.t-10); updatePlayer(); toast("Volvimos 10 segundos atrás."); break;
    case "skipEnd": S.t=VID[S.vid].dur; S.playing=false; updatePlayer(); break;
    case "volDown": S.vol=Math.max(0,S.vol-1); updatePlayer(); break;
    case "volUp": S.vol=Math.min(5,S.vol+1); updatePlayer(); break;
    case "save": {
      if(!S.saved.includes(S.vid)){ S.saved.push(S.vid); persist(); toast("Listo. El video quedó en Guardados."); } else toast("Este video ya está en Guardados.");
      const b=$("psave"); b.classList.add("on"); b.innerHTML=ic("heart","fill")+"<span>Guardado</span>"; break;
    }
    case "next": { const s=suggestions(VID[S.vid],1)[0]; openPlayer(s.id); toast("Ahora vemos: "+s.title); break; }
    case "unsave": S.confirmUnsave=arg; render(true); break;
    case "unsaveNo": S.confirmUnsave=null; render(true); break;
    case "unsaveYes": S.saved=S.saved.filter(id=>id!==arg); S.confirmUnsave=null; persist(); render(true); toast("Listo, se quitó de Guardados."); break;
    case "voice": openVoice(); break;
    case "voiceClose": closeModal(); break;
    case "phrase": choosePhrase(+arg); break;
    case "reset": stopPlayer(); try{ localStorage.removeItem(STORE); }catch(err){}
      stopShorts(); Object.assign(S,{onboarded:false,account:null,interests:[],saved:[],last:null,tab:"home",screen:"welcome",flow:null,backTo:null,filter:"para"}); render(); break;
    case "game": startGame(arg); break;
    case "exitGame": clearTimeout(memTimer); hush(); S.tab="games"; S.screen="games"; render(); break;
    case "level": clearTimeout(memTimer); S.memLevel=arg; newMemory(); render(); break;
    case "hint": hint(); break;
    case "card": flipCard(+arg); break;
    case "memAgain": clearTimeout(memTimer); newMemory(); render(); break;
    case "opt": quizOpt(+arg); break;
    case "quizNext": { const z=S.quiz; hush(); if(z.n+1<z.items.length){ z.n++; setOpts(); } else z.finished=true; render(); break; }
    case "quizAgain": hush(); newQuiz(S.quiz.kind); render(); break;
    case "listen": { const z=S.quiz, it=z.items[z.n]; say(z.solved?fullAns(z,it):it.q+(z.kind==="refran"?" ¿Cómo termina?":"")+" ¿"+z.opts[0].t+", o "+z.opts[1].t+"?"); break; }
    case "bingoCall": bingoCall(); break;
    case "cell": bingoCell(+arg); break;
    case "bingoAgain": newBingo(); render(); break;
    case "short": openShorts(arg); break;
    case "stoggle": { const x=curShort(); if(S.st>=x.dur){ S.st=0; S.sPlaying=true; } else S.sPlaying=!S.sPlaying; updateShort(); break; }
    case "srepeat": S.st=0; S.sPlaying=true; updateShort(); break;
    case "snext": changeShort(1); break;
    case "ssave": { const x=curShort(); if(!S.saved.includes(x.id)){ S.saved.push(x.id); persist(); toast("Listo. El short quedó en Guardados."); } else toast("Este short ya está en Guardados.");
      const b=$("ssave"); b.classList.add("on"); b.innerHTML=`<span class="circ">${ic("heart","fill")}</span><span class="lb">Guardado</span>`; break; }
    case "scrollUp": if(S.screen==="shorts"){ changeShort(-1); break; } content.scrollBy({top:-content.clientHeight*.65,behavior:"smooth"}); break;
    case "scrollDown": if(S.screen==="shorts"){ changeShort(1); break; } content.scrollBy({top:content.clientHeight*.65,behavior:"smooth"}); break;
  }
});
content.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="nameInput"){ e.preventDefault(); $("nameNext").click(); } });
function setBtn(b,dis,html){ b.setAttribute("aria-disabled",dis); if(b.dataset.h!==html){ b.innerHTML=html; b.dataset.h=html; } }
function updateScrollBtns(){
  let up,down,ut,dt;
  if(S.screen==="shorts"){ up=S.sIdx===0; down=false; ut=up?"Es el primero":"Short anterior"; dt="Siguiente short"; }
  else { up=content.scrollTop<=2; down=content.scrollTop+content.clientHeight>=content.scrollHeight-2; ut=up?"Ya está arriba":"Subir lista"; dt=down?"Ya está al final":"Bajar lista"; }
  setBtn($("upBtn"),up,ic(up?"check":"up")+ut); setBtn($("downBtn"),down,ic(down?"check":"down")+dt);
}
content.addEventListener("scroll",updateScrollBtns,{passive:true});
window.addEventListener("resize",updateScrollBtns);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("modal").hidden) closeModal(); });
function clock(){ const d=new Date(); $("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
clock(); setInterval(clock,20000);

render();
})();
</script>
